name: Update free V2Ray configs

# هر ۶ ساعت کانفیگ‌های رایگان را جمع‌آوری، تست و در public/sub ذخیره می‌کند.
# این push باعث اجرای مجدد «Deploy to GitHub Pages» و انتشار نسخه تازه می‌شود.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "update-sub"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect and verify configs
        run: node scripts/update-sub.mjs

      - name: Commit and push
        run: |
          git config user.name "azad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/sub
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update free configs: $(date -u +%FT%TZ)"
            git push origin HEAD:main
          fi
