name: Update free V2Ray configs

# هر ۶ ساعت: جمع‌آوری + تست Xray (پینگ/سرعت/کشور خروجی) + کامیت داده + بیلد و انتشار سایت.
# توجه: push با GITHUB_TOKEN سایر workflowها را اجرا نمی‌کند، بنابراین این workflow
# خودش سایت را بیلد و روی GitHub Pages منتشر می‌کند.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Collect and verify configs
        env:
          VERIFY_PER_COUNTRY: "12"
        run: node scripts/update-sub.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "azad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/sub public/configs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update free configs: $(date -u +%FT%TZ) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: bun install

      - name: Compute base path
        id: bp
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BP=""
          else
            BP="/$REPO_NAME"
          fi
          echo "bp=$BP" >> "$GITHUB_OUTPUT"

      - name: Prepare static export
        run: |
          rm -rf src/app/api
          rm -f next.config.ts next.config.mjs next.config.js next.config.cjs
          printf '%s\n' 'const config = { output: "export", basePath: process.env.NEXT_PUBLIC_BASE_PATH || "", images: { unoptimized: true }, typescript: { ignoreBuildErrors: true }, reactStrictMode: false };' 'export default config;' > next.config.mjs

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.bp.outputs.bp }}
          NEXT_PUBLIC_PROXY_ENABLED: "false"
        run: bunx next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
