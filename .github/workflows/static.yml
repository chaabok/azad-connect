name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compute base path
        id: bp
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BP=""
          else
            BP="/$REPO_NAME"
          fi
          echo "bp=$BP" >> "$GITHUB_OUTPUT"

      - name: Prepare static export
        run: |
          rm -rf src/app/api
          rm -f next.config.ts next.config.mjs next.config.js next.config.cjs
          printf '%s\n' 'const config = { output: "export", basePath: process.env.NEXT_PUBLIC_BASE_PATH || "", images: { unoptimized: true }, typescript: { ignoreBuildErrors: true }, reactStrictMode: false };' 'export default config;' > next.config.mjs

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.bp.outputs.bp }}
          NEXT_PUBLIC_PROXY_ENABLED: "false"
        run: bunx next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
